# Fuxico V2 Commit Conventional

## Action

Use conventional commit format (`<tipo>(<escopo>): <assunto>`) in PT-BR; types allowed by
`@commitlint/config-conventional`: feat fix docs style refactor perf test build ci chore revert.

## Evidence

- `commitlint.config.js`: `export default { extends: ['@commitlint/config-conventional'] }`
- `.husky/commit-msg`: `npx --no-install commitlint --edit "$1"`

