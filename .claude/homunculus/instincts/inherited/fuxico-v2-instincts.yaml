# Fuxico V2 Naming Files

## Action

Components in `PascalCase.tsx`, hooks in `useAlgo.ts`, utilities in `kebab-case.ts` — follow the
neighbouring file in the same folder.

## Evidence

- Padrão observado em `src/components/`, `src/hooks/` e `src/lib/`

