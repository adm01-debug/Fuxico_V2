# Fuxico V2 Test Location

## Action

Unit tests with Vitest next to the module (`__tests__/`) or in `tests/`; Playwright specs in `e2e/`.
Run only what you touched: `npx vitest run <caminho>`.

## Evidence

- `vitest.config.ts` e `playwright.config.ts` na raiz; pastas `tests/` e `e2e/`
