name: Supabase Types Codegen

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch:

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v1
        with: { version: latest }

      - name: Generate types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase gen types typescript \
            --project-id "${{ secrets.SUPABASE_PROJECT_ID }}" \
            > src/integrations/supabase/types.ts

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain src/integrations/supabase/types.ts)" ]]; then
            git config user.name "fuxico-bot"
            git config user.email "bot@fuxico.dev"
            git add src/integrations/supabase/types.ts
            git commit -m "chore(types): regenerate Supabase types"
            git push
          fi
