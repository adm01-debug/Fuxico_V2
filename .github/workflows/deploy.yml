name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      
      # A integracao nativa GitHub x Vercel publica o front em producao. Este step
      # e opcional: falha por token ausente nao pode derrubar o workflow inteiro
      # nem impedir o deploy das edge functions.
      - name: Deploy to Vercel
        continue-on-error: true
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
      
      - name: Deploy Edge Functions
        # A CLI >= 3.1 aborta quando o stdout nao e um terminal ("Re-run with
        # --yes"); sem a flag o job falha e as 52 functions jamais sobem.
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
