<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUXICO</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo">
        <span class="logo-icon">📧</span>
        <span class="logo-text">FUXICO</span>
      </div>
      <div class="header-actions">
        <a href="#" class="dashboard-link" id="openDashboard" title="Abrir Dashboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>
        <button class="logout-btn" id="logoutBtn" title="Sair" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Loading State -->
    <div id="loadingState" class="auth-state">
      <div class="loading-spinner"></div>
      <p class="loading-text">Carregando...</p>
    </div>

    <!-- Login State (quando não autenticado) -->
    <div id="loginState" class="auth-state" style="display: none;">
      <div class="login-card">
        <div class="login-icon">🔐</div>
        <h2 class="login-title">Faça login para continuar</h2>
        <p class="login-subtitle">Conecte sua conta para rastrear emails</p>
        
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
          </div>
          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
          <div id="loginError" class="error-message" style="display: none;"></div>
          <button type="submit" class="btn-primary" id="loginBtn">
            <span class="btn-text">Entrar</span>
            <span class="btn-loading" style="display: none;">
              <div class="loading-spinner small"></div>
            </span>
          </button>
        </form>
        
        <div class="login-divider">
          <span>ou</span>
        </div>
        
        <button class="btn-secondary" id="loginWithGoogleBtn">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span>Continuar com Google</span>
        </button>
        
        <p class="login-help">
          Não tem conta? <a href="#" id="openSignup">Criar conta</a>
        </p>
      </div>
    </div>

    <!-- Dashboard State (quando autenticado) -->
    <div id="dashboardState" class="auth-state" style="display: none;">
      <!-- User Info -->
      <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">U</div>
        <div class="user-details">
          <span class="user-email" id="userEmail">usuario@email.com</span>
          <span class="user-status">✓ Conectado</span>
        </div>
      </div>

      <!-- Status Card -->
      <div class="status-card">
        <div class="status-indicator" id="statusIndicator">
          <div class="status-dot active"></div>
          <span class="status-text">Tracking Ativo</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="trackingToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="totalEmails">-</div>
          <div class="stat-label">Emails</div>
        </div>
        <div class="stat-card success">
          <div class="stat-value" id="totalOpens">-</div>
          <div class="stat-label">Abertos</div>
        </div>
        <div class="stat-card primary">
          <div class="stat-value" id="totalClicks">-</div>
          <div class="stat-label">Cliques</div>
        </div>
      </div>

      <!-- Recent Activity -->
      <div class="section">
        <h3 class="section-title">Atividade Recente</h3>
        <div class="activity-list" id="activityList">
          <div class="activity-empty">
            <span class="activity-empty-icon">📭</span>
            <span class="activity-empty-text">Nenhuma atividade ainda</span>
          </div>
        </div>
      </div>

      <!-- Settings -->
      <div class="section">
        <h3 class="section-title">Configurações</h3>
        <div class="settings-list">
          <label class="setting-item">
            <span class="setting-label">
              <span class="setting-icon">🔔</span>
              Notificações
            </span>
            <input type="checkbox" id="notificationsToggle" checked>
          </label>
          <label class="setting-item">
            <span class="setting-label">
              <span class="setting-icon">🔊</span>
              Som de alerta
            </span>
            <input type="checkbox" id="soundToggle">
          </label>
          <label class="setting-item">
            <span class="setting-label">
              <span class="setting-icon">✓✓</span>
              Marcadores no Gmail
            </span>
            <input type="checkbox" id="markersToggle" checked>
          </label>
          <label class="setting-item">
            <span class="setting-label">
              <span class="setting-icon">🙈</span>
              Ocultar auto-aberturas
            </span>
            <input type="checkbox" id="selfOpensToggle" checked>
          </label>
          <label class="setting-item">
            <span class="setting-label">
              <span class="setting-icon">✍️</span>
              Assinatura "Enviado com FUXICO"
            </span>
            <input type="checkbox" id="signatureToggle">
          </label>
          <label class="setting-item">
            <span class="setting-label">
              <span class="setting-icon">⏰</span>
              Lembrete após (dias)
            </span>
            <input type="number" id="reminderDaysInput" class="setting-number" min="1" max="30" step="1" value="3">
          </label>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span class="version" id="versionText">v1.1.0</span>
      <a href="#" class="help-link" id="helpLink">Ajuda</a>
    </footer>
  </div>

  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
