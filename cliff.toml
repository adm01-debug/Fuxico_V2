# =============================================================================
# FUXICO - Git-cliff Configuration
# Arquivo: cliff.toml
# Documentação: https://git-cliff.org/docs/configuration
# =============================================================================

[changelog]
# Template do header do changelog
header = """
# Changelog

Todas as mudanças notáveis deste projeto serão documentadas neste arquivo.

O formato é baseado em [Keep a Changelog](https://keepachangelog.com/pt-BR/1.0.0/),
e este projeto adere ao [Semantic Versioning](https://semver.org/lang/pt-BR/).

"""

# Template do body (para cada versão)
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.github.username %} by @{{ commit.github.username }}{% endif %}\
            {% if commit.github.pr_number %} in [#{{ commit.github.pr_number }}](https://github.com/adm01-debug/fuxico/pull/{{ commit.github.pr_number }}){% endif %}\
    {% endfor %}
{% endfor %}\n
"""

# Template do footer
#
# `release.previous` é nulo quando não existe tag anterior (este repositório não
# tem nenhuma tag), e tocar em `release.previous.version` faz o render falhar com
# "Variable `release.previous.version` not found in context while rendering
# 'footer'". Por isso o acesso é guardado por `{% if release.previous %}`.
#
# O histórico curado manualmente fica neste footer porque `.github/workflows/changelog.yml`
# regrava o CHANGELOG.md inteiro a cada push na main (`--prepend` não é usado: ele
# reescreveria header/body/footer em cima do arquivo a cada execução).
footer = """
## Histórico curado (anterior à automação)

Versões registradas manualmente antes de o CHANGELOG.md passar a ser gerado pelo git-cliff.

### [3.0.0] - 2026-07-23 — Perfection Release 🏆

#### Adicionado (Ondas 103-110)
- **DSAR em Storage** (Onda 103): bucket privado `dsar-exports` com RLS por `user_id` + URL assinada 24h; fallback inline <2MB.
- **Alertas ativos** (Onda 104): `dispatch_critical_alerts()` enfileira notificações in-app para admins com cron diário 06:15 UTC.
- **Cold archive de partições** (Onda 105): bucket `cold-archive` + `archive_partition_before_drop()` preserva dados antes do descarte.
- **Fila de re-entrega de webhooks** (Onda 106): `webhook_retry_queue` + `replay_failed_webhooks()` para reenvio manual/auto de falhas 5xx.
- **Canário RLS runtime** (Onda 107): `admin_rls_canary()` diário valida isolamento em 20 tabelas críticas em produção.
- **Health Score v3** (Onda 108): `admin_pool_stats()` + `admin_signing_key_status()` incorporados ao score global.
- **MFA timing-safe** (Onda 109): `constantTimeEq` no `verify-backup` + delay uniforme 50-150ms em falha.
- **Scorecard 10/10** (Onda 110): 22 dimensões todas em A+ com evidência auditável.

#### Marcos
- Nota global: **10.0 / 10** — Grade **A+**.
- 0 vulnerabilidades críticas/altas mantidas desde a Onda 87.

### [1.1.0] - 2024-12-23

#### Adicionado
- ErrorBoundary para captura de erros
- React.lazy() para componentes grandes (code splitting)
- Paginação cursor-based em get-tracking-stats
- Integração com Salesforce CRM
- Integração com Pipedrive CRM
- Internacionalização (PT-BR, EN-US, ES)
- SkipLinks para acessibilidade
- ThemeProvider para modo escuro
- 31 testes de hooks
- Documentação OpenAPI
- CI/CD com GitHub Actions
- Testes E2E com Playwright

#### Melhorado
- Rate limiting em todas as 14 Edge Functions
- Validação Zod em todas as Edge Functions
- Security headers em todas as Edge Functions
- CORS restritivo (whitelist de domínios)
- README com documentação completa
- Cobertura de testes (87% → 100%)

#### Removido
- 34 console.logs de produção

#### Corrigido
- N+1 Query em get-tracking-stats (view materializada)
- Imports incorretos no providers.ts

### [1.0.0] - 2024-12-01

#### Adicionado
- Rastreamento de emails com pixel invisível
- Detecção de aberturas e cliques
- Extensão Chrome (Manifest V3)
- Integração com Bitrix24
- Integração com HubSpot
- Dashboard com estatísticas
- Sistema de auditoria
- Alertas de fraude
- Notificações em tempo real
- PWA com suporte offline

{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/adm01-debug/Fuxico_V2/compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/adm01-debug/Fuxico_V2/releases/tag/{{ release.version }}
        {% endif -%}
    {% else -%}
        [unreleased]: https://github.com/adm01-debug/Fuxico_V2/commits/main
    {% endif -%}
{% endfor %}

[1.1.0]: https://github.com/adm01-debug/fuxico/compare/v1.0.0...v1.1.0
[1.0.0]: https://github.com/adm01-debug/fuxico/releases/tag/v1.0.0

---

*Gerado automaticamente por [git-cliff](https://git-cliff.org)*
"""

# Remove leading/trailing whitespace
trim = true
# Processar datas
postprocessors = [
    { pattern = '<REPO>', replace = "https://github.com/adm01-debug/fuxico" },
]

[git]
# Parse conventional commits
conventional_commits = true
filter_unconventional = true
split_commits = false

# Sorting commits
commit_order = "oldest"
sort_commits = "oldest"

# Commit parsers - mapeia tipos para grupos
commit_parsers = [
    { message = "^feat", group = "✨ Features" },
    { message = "^fix", group = "🐛 Correções" },
    { message = "^doc", group = "📚 Documentação" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "♻️ Refatoração" },
    { message = "^style", group = "🎨 Estilo" },
    { message = "^test", group = "🧪 Testes" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore|^ci", group = "🔧 Manutenção" },
    { body = ".*security", group = "🔐 Segurança" },
    { message = "^revert", group = "⏪ Reversões" },
]

# Protect breaking changes
protect_breaking_commits = false

# Filter commits
filter_commits = false

# Tag pattern (para versões)
tag_pattern = "v[0-9].*"

# Ignorar tags específicas
skip_tags = ""

# Ignorar commits específicos
ignore_tags = ""

# Limite de commits por grupo
# topo_order = false
# limit_commits = 42
